name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it manually
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff0000&color_dots=#161b22,#4d0000,#800000,#b30000,#ff0000
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff0000
            dist/snake-red.svg?color_snake=#ff0000&color_dots=#0d1117,#3d0000,#7a0000,#b30000,#ff0000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
